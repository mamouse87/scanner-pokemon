details.menu .mn{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(24,34,58,.14);padding:6px;display:flex;flex-direction:column;min-width:240px;z-index:20}
details.menu .mn button{border:0;text-align:left;border-radius:6px;font-weight:500;color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.card{position:relative;background:var(--card);border-radius:12px;padding:8px;border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column}
.card:hover{border-color:#c5cfdf}
.card .im{position:relative;width:100%;aspect-ratio:63/88;border-radius:7px;background:#eef1f5;display:flex;align-items:center;justify-content:center;color:#a2abba;font-size:22px;overflow:hidden}
.card .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.card.no{background:transparent;border-color:transparent}
.card.no .im{filter:grayscale(1);opacity:.32}
.card.no .info{opacity:.5}
.band{margin:7px 0 0;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:700;display:flex;flex-direction:column;gap:1px}
.band .bl{display:flex;justify-content:space-between;gap:6px}
.band .r{color:var(--rev)}
.band.b-ok{background:#e6f4ec;color:var(--ok)}
.band.b-sb{background:#eceff4;color:var(--sbc)}
.card.yes{border-color:#bfe0cc}
.card.sb{border:1.5px dashed #aab4c4}
.card.vr{border-color:#f0b98d}
.vtag{position:absolute;top:13px;left:13px;background:var(--var);color:#fff;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.info{font-size:13px;margin-top:6px;line-height:1.3}
.info .nr{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.info b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info small{display:block;color:var(--mut);font-size:11.5px}
.fs{display:inline-block;font-size:10px;font-weight:700;color:#5d4500;background:#fbe7a6;border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
.cd{display:inline-block;font-size:10.5px;font-weight:800;background:var(--line);color:var(--fg);border-radius:4px;padding:0 4px}
.card.sel{outline:3px solid var(--navy);outline-offset:2px}
.card.sel::after{content:"✓";position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;margin:0 0 14px;border:1px solid #c5d3ee;border-radius:12px;background:#eef3fc;position:sticky;top:-22px;z-index:5}
button.danger{background:var(--red);color:#fff;border-color:var(--red)}
button.danger:hover{background:#a92c23}
.undobar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:#fff;padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:50;box-shadow:0 10px 26px rgba(24,34,58,.3)}
.undobar button{background:var(--acc);color:#2a2000;border:0}
.undobar button.ux{background:transparent;color:#fff;padding:4px 6px;margin-left:-6px;opacity:.75}.undobar button.ux:hover{opacity:1}
.est{display:block;font-size:11.5px;color:var(--mut);margin-top:2px}
.vbox{border:1px solid #f6d2b3;background:#fff4ea;border-radius:10px;padding:10px 12px;margin:8px 0}
.price{font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.info .pr{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:2px}

.hide{display:none!important}
.empty{text-align:center;color:var(--mut);margin-top:60px;line-height:1.7}
.empty a{color:var(--navy)}
dialog{border:0;border-radius:14px;background:var(--card);color:var(--fg);width:min(960px,94vw);max-height:90vh;padding:22px;box-shadow:0 24px 60px rgba(24,34,58,.25)}
dialog::backdrop{background:rgba(24,34,58,.35)}
dialog h3{margin-top:0}
dialog table{width:100%;border-collapse:collapse}
dialog td,dialog th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
td.line{font-size:12px;color:var(--mut);max-width:360px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:#fff;padding:11px 18px;border-radius:10px;z-index:40;font-weight:600;max-width:80vw;box-shadow:0 10px 26px rgba(24,34,58,.3)}
.small{font-size:12px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:12px;padding:12px 16px;border:1px solid var(--line)}
.kpi b{display:block;font-size:24px;margin-top:2px}
.kpi span{font-size:12px;color:var(--mut)}
.panels{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.panel{background:var(--card);border-radius:12px;padding:16px 18px;border:1px solid var(--line)}
.panel h3{margin:0 0 10px;font-size:15px}
.bars .br2{display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center;font-size:12.5px;margin:4px 0}
.bars .tr{height:14px;background:var(--bg);border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--ok);border-radius:4px}
.bars .tr i.r{background:var(--rev)}.bars .tr i.a{background:var(--acc)}
.bars .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .vl{text-align:right;color:var(--mut)}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut)}
.cols .c i{display:block;width:100%;background:var(--ok);border-radius:4px 4px 0 0;min-height:2px}
.cols .c b{color:var(--fg);font-size:11px}
.panel table{width:100%;border-collapse:collapse;font-size:12.5px}
.panel td,.panel th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.panel th{color:var(--mut);font-weight:600}
.up{color:#e5484d}.down{color:var(--ok)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);padding:10px 12px;border-radius:12px;border:1px solid var(--line);margin-bottom:14px}
.filters label{font-size:12px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 10px;background:transparent}
.seg button.on{background:var(--navy);color:#fff}
.delta{font-size:12px;font-weight:700;margin-left:6px}
.delta.pos{color:var(--ok)}.delta.neg{color:#e5484d}.delta.eq{color:var(--mut)}
.kpi small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.otable tr.ord{cursor:pointer}.otable tr.ord:hover td{background:var(--bg)}
.otable tr.det td{background:var(--bg);font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--bg)}
.tag.cm{background:#1e4fa3;color:#fff}.tag.eb{background:#e53238;color:#fff}.tag.mn{background:var(--line)}
.panel.wide{grid-column:1/-1}
.rtable{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.rtable th{position:sticky;top:-16px;background:var(--card);color:var(--mut);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);z-index:1}
.rtable td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rtable td.n{text-align:right;white-space:nowrap}
.rtable small{display:block;color:var(--mut);font-size:11.5px}
.rtable input[type=number]{width:78px;padding:3px 6px}
.st{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.st.down{background:#e5484d;color:#fff}.st.up{background:var(--ok);color:#fff}.st.ok{background:var(--line);color:var(--fg)}

/* dettaglio carta */
dialog.cdw{width:min(1040px,95vw);padding:0}
.cdx{display:grid;grid-template-columns:270px 1fr;min-height:0;background:#fff}
.cd-img{background:#eef1f6;padding:22px 18px;border-right:1px solid var(--line)}
.cd-img img{width:100%;border-radius:10px;box-shadow:0 10px 26px rgba(24,34,58,.22);display:block}
.cd-img .small{margin:10px 0 0;text-align:center}
.cd-cm{display:block;color:inherit;text-decoration:none;border-radius:12px}
.cd-cm img{transition:transform .15s,box-shadow .15s}
.cd-cm:hover img{transform:translateY(-2px);box-shadow:0 14px 30px rgba(24,34,58,.3)}
.cd-cm>span{display:block;margin-top:12px;text-align:center;font-weight:700;font-size:13.5px;color:#1d3d7a}
.cd-cm>span small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.cd-cm:hover>span{text-decoration:underline}
.cd-cm:focus-visible{outline:3px solid #f3c33c;outline-offset:4px}
.cd-cml{margin-left:auto;font-size:12.5px;font-weight:700;color:#1d3d7a;text-decoration:none;white-space:nowrap}
.cd-cml:hover{text-decoration:underline}.cd-tag+.cd-cml{margin-left:0}
.cd-main{padding:20px 24px 22px;min-width:0}
.cd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cd-head h3{display:inline;margin:0;font-size:24px;letter-spacing:-.01em}
.cd-num{font-size:24px;font-weight:400;color:var(--mut);margin-right:8px;font-variant-numeric:tabular-nums}
.cd-sub{color:var(--mut);font-size:13.5px;margin-top:2px}
.cd-x{border:0!important;background:none!important;font-size:18px;color:var(--mut)!important;padding:4px 8px!important}
.cd-figs{display:flex;margin:16px 0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cd-figs>div{flex:1;padding:9px 12px;border-right:1px solid var(--line);min-width:0}.cd-figs>div:last-child{border-right:0}
.cd-figs b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.cd-figs span{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cd-figs .g b{color:var(--ok)}.cd-figs .s b{color:var(--sbc)}.cd-figs .v b{color:var(--navy)}
.cd-v{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:12px;padding:12px 14px;margin:10px 0}
.cd-v.sb{border-left-color:var(--sbc);background:#fafbfd}
.cd-v header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cd-v header b{font-size:15px}.cd-v header .rv{color:var(--rev)}.cd-v header>span{color:var(--mut);font-size:13px}
.cd-v .st{font-style:normal;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:#e3f3ea;color:var(--ok)}
.cd-v.sb .st{background:#e9edf3;color:var(--sbc)}
.cd-tag{margin-left:auto;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px}
.cd-tag.ok{background:#e3f3ea;color:var(--ok)}.cd-tag.hi{background:#fde7e4;color:var(--red)}.cd-tag.lo{background:#e3edfa;color:#2d6cc0}
.cd-row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.cd-row>.sm{align-self:center}
.cd-ph{aspect-ratio:63/88;border-radius:10px;background:#dfe4ec;display:grid;place-items:center;font-size:40px;color:#9aa6ba;font-weight:700}
.cd-row label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.cd-row input{width:96px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.cd-row label:nth-of-type(2) input{width:72px}
.cd-row small{font-size:11.5px}
.cd-rule{display:flex;flex-direction:column;font-size:12px;color:var(--mut);margin-right:auto;min-width:0}
.cd-rule b{font-size:14px;color:var(--fg)}
.cd-mk{display:grid;grid-template-columns:repeat(7,1fr);margin-top:12px;background:#f6f8fb;border-radius:10px;overflow:hidden}
.cd-mk>div{padding:7px 8px;min-width:0}.cd-mk span{display:block;font-size:11px;color:var(--mut)}.cd-mk b{font-size:14px;font-variant-numeric:tabular-nums}
.cd-mk .c{background:#e3f3ea}.cd-mk .c span,.cd-mk .c b{color:var(--ok)}
.cd-range{position:relative;height:18px;margin:12px 6px 0;overflow:hidden}
.cd-range .trk{position:absolute;left:0;right:0;top:6px;height:6px;border-radius:99px;background:linear-gradient(90deg,#cfe9db,#eef1f6 50%,#f8d9d4)}
.cd-range .mk{position:absolute;top:0;width:4px;height:18px;border-radius:2px;transform:translateX(-50%);margin-left:0}
.cd-range .mk[style*="left:0"]{transform:none}.cd-range .mk[style*="left:100"]{transform:translateX(-100%)}
.cd-range .m-c{background:var(--ok)}.cd-range .m-p{background:var(--navy)}
.cd-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;margin:4px 6px 0}
.cd-leg .p{color:var(--navy)}.cd-leg .c{color:var(--ok)}.cd-leg .r{margin-left:auto;color:var(--mut);font-weight:400}
.cd-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:6px}
.cd-foot>div{flex:1}
.cd-none{color:var(--mut);font-size:13px;margin:8px 0}
.cd-sold{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.cd-sold summary{cursor:pointer;font-weight:700;font-size:14px}
@media (max-width:760px){.cdx{grid-template-columns:1fr}.cd-img{border-right:0;border-bottom:1px solid var(--line)}.cd-img img{max-width:220px;margin:auto}.cd-mk{grid-template-columns:repeat(4,1fr)}.cd-figs{flex-wrap:wrap}}

</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Gestionale carte</h1></div>
  <div class="tstats" id="stats"></div>
  <div class="gs" id="gs"><input type="search" id="gQ" autocomplete="off" spellcheck="false" placeholder="Cerca carte, numeri, set, rarità, tipo, vendite…" title="Cerca in tutto il gestionale (scorciatoia: /)"><div class="gres" id="gRes" hidden></div></div>
  <div class="tact">
    <button id="btnAdd" class="tadd" title="Carte nuove: dalle liste dell'app o a mano">＋ Aggiungi carte</button>
    <details class="menu tm" id="saleMenu"><summary>🧾 Registra una vendita <span class="car">▾</span></summary><div class="mn">
      <button id="btnSale"><b>Ordine di Cardmarket</b><small>Carica il PDF dell'ordine: le carte vendute escono dal magazzino</small></button>
      <button id="btnClF"><b>Cliente diretto o scambio</b><small>Foto della lista PDF che il cliente ha segnato</small></button>
    </div></details>
    <details class="menu tm undo" id="undoMenu"><summary id="undoSum" class="tic" title="Annulla">↶</summary><div class="mn" id="undoList"></div></details>
    <a id="btnCm" class="tlnk" href="https://www.cardmarket.com/it/Pokemon/Stock/Offers/Singles" target="cardscanner" referrerpolicy="no-referrer" title="Le tue offerte su Cardmarket">Cardmarket ↗</a>
    <button id="btnBk" class="tsave" title="Backup"><i class="sd"></i></button>
    <button id="btnMore" class="ticon" title="Impostazioni">⚙</button>
  </div>
</div>
<nav class="tabs" id="tabs"></nav>
<div class="wrap">
  <aside>
    <div class="head">
      <input type="search" id="qSet" placeholder="Cerca set…">
      <label class="small" style="display:block;margin-top:6px"><input type="checkbox" id="onlyMine"> solo i miei set (in vendita o Standby)</label>
    </div>
    <div id="sets"><p class="small" style="padding:12px">Carico l'elenco dei set…</p></div>
  </aside>
  <main id="main"></main>
</div>

<input type="file" id="fSale" accept=".pdf,.html,.htm" multiple hidden>
<input type="file" id="fCat" accept=".txt,.html,.htm,text/*" multiple hidden><input type="file" id="fPg" accept=".json,application/json" hidden><input type="file" id="fRestore" accept=".json" hidden>
<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script src="boot.js"></script>

</body>
