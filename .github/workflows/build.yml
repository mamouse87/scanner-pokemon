name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Licenze SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compila
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CardScanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CardScanner-apk
          path: CardScanner.apk

      - name: Pubblica nelle Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Card Scanner ${{ github.run_number }}
          files: CardScanner.apk
          make_latest: true
