<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestionale carte in vendita</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1c2128;--mut:#6b7280;--acc:#e3b500;--rev:#a64fd1;--ok:#2f9e5b;--line:#e1e4e8;--side:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1c2128;--fg:#e8eaed;--mut:#9aa3ad;--acc:#ffcb05;--rev:#cc5de8;--ok:#3ecf6e;--line:#2a313b;--side:#171b21}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
.top{background:var(--card);padding:10px 18px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:3}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h1{margin:0;font-size:20px}
.stats{color:var(--mut);font-size:13px}
button,select,input{font:inherit;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{cursor:pointer}
button.pri{background:var(--acc);color:#111;border:0;font-weight:700}
button.sm{padding:2px 8px;font-size:12px}
.wrap{flex:1;display:flex;min-height:0}
aside{width:300px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside .head{padding:10px;border-bottom:1px solid var(--line)}
aside input[type=search]{width:100%}
#sets{overflow:auto;flex:1}
#sets .grp{padding:8px 12px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
#sets a{display:flex;justify-content:space-between;gap:8px;padding:6px 12px;color:var(--fg);text-decoration:none;border-left:3px solid transparent}
#sets a:hover{background:var(--bg)}
#sets a.sel{background:var(--bg);border-left-color:var(--acc);font-weight:600}
#sets a .n{background:var(--ok);color:#fff;border-radius:99px;padding:0 8px;font-size:12px;font-weight:700;height:20px;line-height:20px}
main{flex:1;overflow:auto;padding:16px 22px 60px}
.sethead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.sethead h2{margin:0;font-size:22px}
.sub{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;background:var(--card);border-radius:10px;padding:7px;box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:pointer}
.card .im{position:relative;width:100%;aspect-ratio:63/88;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:22px;overflow:hidden}
.card .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.card.no .im{filter:grayscale(1);opacity:.35}
.card.no .info{opacity:.55}
.card.yes{outline:3px solid var(--ok)}
.card.yes.r{outline-color:var(--rev)}
.info{font-size:12.5px;margin-top:5px}
.info small{display:block;color:var(--mut)}
.badges{position:absolute;top:11px;right:11px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.badges span{font-weight:700;font-size:12px;border-radius:99px;padding:2px 8px;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.bn{background:var(--ok)}.br{background:var(--rev)}
.price{font-weight:700;color:var(--ok)}
.hide{display:none!important}
.empty{text-align:center;color:var(--mut);margin-top:60px;line-height:1.7}
.empty a{color:var(--acc)}
dialog{border:0;border-radius:12px;background:var(--card);color:var(--fg);width:min(940px,94vw);max-height:90vh;padding:18px}
dialog h3{margin-top:0}
dialog table{width:100%;border-collapse:collapse}
dialog td,dialog th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
td.line{font-size:12px;color:var(--mut);max-width:360px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:10px;z-index:40;font-weight:600}
.small{font-size:12px;color:var(--mut)}
.big img{max-width:100%;max-height:60vh;border-radius:10px;display:block;margin:0 auto 10px}
</style>
</head>
<body>
<div class="top">
  <div class="row" style="justify-content:space-between">
    <div><h1>Gestionale carte in vendita</h1><div class="stats" id="stats"></div></div>
    <div class="row">
      <button class="pri" id="btnSale">🧾 Carica vendite</button>
      <button id="btnSold">📜 Vendute</button>
      <button id="btnMore">⚙ Altro</button>
    </div>
  </div>
</div>
<div class="wrap">
  <aside>
    <div class="head">
      <input type="search" id="qSet" placeholder="Cerca set…">
      <label class="small" style="display:block;margin-top:6px"><input type="checkbox" id="onlyMine"> solo set con carte in vendita</label>
    </div>
    <div id="sets"></div>
  </aside>
  <main id="main"></main>
</div>

<input type="file" id="fSale" accept=".pdf,.csv,.txt,.html,.htm" multiple hidden>
<input type="file" id="fRestore" accept=".json" hidden>
<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script>
'use strict';
const KEY = 'gestionaleCarte_v2';
const CM = 'https://www.cardmarket.com/it/Pokemon/Stock/ListingMethods/BulkListing?sortBy=number&idExpansion=';
const LANGN = { it: 'Italiano', en: 'Inglese', fr: 'Francese', de: 'Tedesco', es: 'Spagnolo', pt: 'Portoghese' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = n => /^\d+$/.test(n) ? String(parseInt(n, 10)) : String(n || '').toUpperCase();
const simp = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const eur = v => v == null ? '' : Number(v).toFixed(2).replace('.', ',') + ' €';
const today = () => new Date().toISOString();
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ---------- dati (salvati in questo browser) ----------
// exps[id] = {id, name, cards:{pid:{p,n,c,u,r,i,h}}}   elenco carte del set, preso dalla pagina di Cardmarket
// expList = [[id, name], ...]                          tutti i set di Cardmarket
// listings[pid|N/R|lang] = {p, exp, rev, lang, q, price, date, com}
// sold = [{date, p, exp, name, num, rev, lang, q, price, source, file}]
let state = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.exps) return Object.assign({ expList: [], listings: {}, sold: [], legacy: [] }, s); } catch (e) {}
  const s = { exps: {}, expList: [], listings: {}, sold: [], legacy: [] };
  // dati della versione precedente: li tengo da parte e li abbino quando arriva l'elenco del loro set
  try {
    const old = JSON.parse(localStorage.getItem('gestionaleCarte_v1'));
    if (old && old.cards) for (const c of Object.values(old.cards)) {
      if (c.qty > 0 && c.sites && c.sites.Cardmarket && c.sites.Cardmarket.on)
        s.legacy.push({ setName: c.setName, num: c.num, rev: c.rev, lang: c.lang, q: c.qty, price: c.sites.Cardmarket.price ?? null, name: c.name });
    }
  } catch (e) {}
  return s;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { alert('Il browser non riesce a salvare: fai un Backup da "Altro".'); } }
const lkey = (p, rev, lang) => `${p}|${rev ? 'R' : 'N'}|${lang || 'it'}`;
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 4000); }
function expName(id) { return state.exps[id]?.name || (state.expList.find(x => x[0] === id) || [])[1] || ('Set ' + id); }
function cardOf(l) { return state.exps[l.exp]?.cards?.[l.p]; }
// immagine: provo più fonti in fila (foto Cardmarket, foto Cardmarket ricostruita, foto inglese Limitless TCG)
function imgSrcs(c) {
  const u3 = /^\d+$/.test(c.u || '') ? String(parseInt(c.u, 10)).padStart(3, '0') : c.u;
  return [...new Set([
    c.i,
    c.c && c.p ? `https://product-images.s3.cardmarket.com/51/${c.c}/${c.p}/${c.p}.jpg` : '',
    c.c && u3 ? `https://limitlesstcg.nyc3.cdn.digitaloceanspaces.com/tpci/${c.c}/${c.c}_${u3}_R_EN_LG.png` : ''
  ].filter(Boolean))];
}
function imgTag(c, lazy) {
  const s = imgSrcs(c);
  if (!s.length) return '';
  return `<img ${lazy ? 'loading="lazy"' : ''} referrerpolicy="no-referrer" src="${esc(s[0])}" data-srcs="${esc(s.slice(1).join('|'))}" alt="" onerror="nextImg(this)">`;
}
function nextImg(im) {
  const rest = (im.dataset.srcs || '').split('|').filter(Boolean);
  if (!rest.length) { im.remove(); return; }
  im.dataset.srcs = rest.slice(1).join('|');
  im.src = rest[0];
}
// prezzo: quello inviato dallo script; se manca, il tuo prezzo attuale letto sulla pagina di Cardmarket
const priceOf = l => l.price != null ? l.price : (cardOf(l)?.m ?? null);

// ---------- arrivo dati dallo script di Cardmarket ----------
function mergeCatalog(exp) {
  if (!exp || !exp.id) return;
  const E = state.exps[exp.id] || (state.exps[exp.id] = { id: exp.id, name: exp.name || '', cards: {} });
  if (exp.name) E.name = exp.name;
  (exp.cards || []).forEach(c => { E.cards[c.p] = Object.assign(E.cards[c.p] || {}, c); });
  // abbino i dati della versione precedente (nome del set + numero)
  if (state.legacy.length && E.name) {
    const byNum = {};
    Object.values(E.cards).forEach(c => { byNum[norm(c.u)] = c; });
    state.legacy = state.legacy.filter(l => {
      if (simp(l.setName) !== simp(E.name)) return true;
      const c = byNum[norm(l.num)];
      if (!c) return true;
      const k = lkey(c.p, l.rev, l.lang);
      if (!state.listings[k]) state.listings[k] = { p: c.p, exp: E.id, rev: l.rev, lang: l.lang, q: l.q, price: l.price, date: today(), com: '' };
      return false;
    });
  }
}
function importFromHash() {
  const m = location.hash.match(/^#cm2=(.+)$/);
  if (!m) return null;
  history.replaceState(null, '', location.pathname);
  let d;
  try { d = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); } catch (e) { alert('Dati da Cardmarket non leggibili.'); return null; }
  if (Array.isArray(d.exps) && d.exps.length) state.expList = d.exps;
  mergeCatalog(d.exp);
  let n = 0;
  for (const sub of d.listed || []) {
    mergeCatalog({ id: sub.exp, name: sub.name, cards: sub.cards });
    for (const r of sub.rows) {
      const k = lkey(r.p, r.rev, r.lang);
      const L = state.listings[k] || (state.listings[k] = { p: r.p, exp: sub.exp, rev: r.rev, lang: r.lang, q: 0, price: null, date: sub.at, com: '' });
      L.q += r.q;
      if (r.price != null) L.price = r.price;
      L.date = sub.at; L.com = r.com || L.com;
      n += r.q;
    }
  }
  save();
  const id = (d.listed && d.listed.length ? d.listed[d.listed.length - 1].exp : null) || (d.exp && d.exp.id) || null;
  setTimeout(() => toast(n ? `Aggiornato: ${n} carte messe in vendita su Cardmarket` : `Elenco del set "${expName(id)}" aggiornato`), 200);
  return id;
}

// ---------- lista dei set a sinistra ----------
let selected = null;
function counts() {
  const c = {};
  for (const l of Object.values(state.listings)) c[l.exp] = (c[l.exp] || 0) + l.q;
  return c;
}
function renderSets() {
  const cnt = counts();
  const q = simp($('qSet').value), only = $('onlyMine').checked;
  const all = new Map(state.expList.map(([id, name]) => [id, name]));
  Object.values(state.exps).forEach(e => { if (!all.has(e.id)) all.set(e.id, e.name || ('Set ' + e.id)); });
  const items = [...all.entries()].filter(([id, name]) => (!q || simp(name).includes(q)) && (!only || cnt[id]));
  const mine = items.filter(([id]) => cnt[id]).sort((a, b) => a[1].localeCompare(b[1]));
  const rest = items.filter(([id]) => !cnt[id]).sort((a, b) => a[1].localeCompare(b[1]));
  const link = ([id, name]) => `<a href="#" data-id="${esc(id)}" class="${id === selected ? 'sel' : ''}"><span>${esc(name)}</span>${cnt[id] ? `<span class="n">${cnt[id]}</span>` : ''}</a>`;
  $('sets').innerHTML = ((mine.length ? `<div class="grp">Con carte in vendita</div>${mine.map(link).join('')}` : '') +
    (rest.length ? `<div class="grp">${mine.length ? 'Tutti gli altri set' : 'Tutti i set'} (${rest.length})</div>${rest.map(link).join('')}` : '')) ||
    '<p class="small" style="padding:12px">L\'elenco dei set arriva da Cardmarket la prima volta che usi il pulsante "Card Scanner → CM".</p>';
}
$('sets').addEventListener('click', e => {
  const a = e.target.closest('a[data-id]');
  if (!a) return;
  e.preventDefault();
  selected = a.dataset.id;
  renderSets(); renderSet();
  $('main').scrollTop = 0;
});
$('qSet').addEventListener('input', renderSets);
$('onlyMine').addEventListener('change', renderSets);

// ---------- set aperto: tutte le carte ----------
let filter = 'all', filterText = '';
function renderSet() {
  const main = $('main');
  if (!selected) {
    main.innerHTML = `<div class="empty">Scegli un set dalla lista a sinistra.<br>
      Le carte e i prezzi arrivano in automatico da Cardmarket: compila la pagina "Inserisci carte bulk" con il pulsante <b>Card Scanner → CM</b>,
      premi "Mettere in vendita le carte" e poi il pulsante verde dello script.</div>`;
    return;
  }
  const E = state.exps[selected];
  const mine = Object.entries(state.listings).filter(([, l]) => l.exp === selected);
  if (!E || !Object.keys(E.cards).length) {
    main.innerHTML = `<div class="empty"><h2>${esc(expName(selected))}</h2>Non ho ancora l'elenco delle carte di questo set.<br>
      Apri <a href="${CM}${encodeURIComponent(selected)}" target="_blank">la pagina "Inserisci carte bulk" di questo set su Cardmarket</a>, premi <b>Card Scanner → CM</b>
      e poi "Invia solo l'elenco di questo set al gestionale" (in fondo al pannello).<br>Se il set ha due pagine, fallo su entrambe.</div>`;
    return;
  }
  const byP = {};
  mine.forEach(([k, l]) => (byP[l.p] = byP[l.p] || []).push([k, l]));
  const cards = Object.values(E.cards).sort((a, b) => (parseInt(a.u) || 9999) - (parseInt(b.u) || 9999) || String(a.u).localeCompare(String(b.u)));
  const copies = mine.reduce((a, [, l]) => a + l.q, 0);
  const value = mine.reduce((a, [, l]) => a + (priceOf(l) || 0) * l.q, 0);
  let h = `<div class="sethead"><div><h2>${esc(E.name)}</h2>
    <div class="sub">${cards.length} carte nel set · in vendita ${Object.keys(byP).length} diverse, ${copies} copie · valore ${eur(value)}</div></div>
    <div class="row"><input type="search" id="qCard" placeholder="Cerca carta…">
    <select id="fShow"><option value="all">Tutte le carte del set</option><option value="yes">Solo in vendita</option><option value="no">Solo non in vendita</option><option value="rev">Solo Reverse in vendita</option></select>
    <a href="${CM}${encodeURIComponent(E.id)}" target="_blank"><button>Apri su Cardmarket ↗</button></a></div></div><div class="grid">`;
  for (const c of cards) {
    const ls = byP[c.p] || [];
    const n = ls.filter(([, l]) => !l.rev).reduce((a, [, l]) => a + l.q, 0);
    const r = ls.filter(([, l]) => l.rev).reduce((a, [, l]) => a + l.q, 0);
    const prices = [...new Set(ls.map(([, l]) => priceOf(l)).filter(v => v != null))].sort((a, b) => a - b);
    const s = esc(`${c.n} ${c.u} ${norm(c.u)} ${c.r}`.toLowerCase());
    h += `<div class="card ${ls.length ? 'yes' : 'no'}${r ? ' r' : ''}" data-p="${esc(c.p)}" data-s="${s}">
      <div class="im"><span>${esc(c.u)}</span>${imgTag(c, true)}</div>
      ${ls.length ? `<div class="badges">${n ? `<span class="bn">×${n}</span>` : ''}${r ? `<span class="br">R ×${r}</span>` : ''}</div>` : ''}
      <div class="info"><b>${esc(c.u)}</b> ${esc(c.n)}<small>${esc(c.r)}</small>${prices.length ? `<span class="price">${prices.map(eur).join(' / ')}</span>` : ''}</div></div>`;
  }
  main.innerHTML = h + '</div>';
  $('qCard').value = filterText; $('fShow').value = filter;
  $('qCard').oninput = () => { filterText = $('qCard').value; applyCardFilter(); };
  $('fShow').onchange = () => { filter = $('fShow').value; applyCardFilter(); };
  applyCardFilter();
}
function applyCardFilter() {
  const t = filterText.trim().toLowerCase();
  document.querySelectorAll('.card').forEach(el => {
    let ok = !t || el.dataset.s.includes(t);
    if (filter === 'yes') ok = ok && el.classList.contains('yes');
    if (filter === 'no') ok = ok && el.classList.contains('no');
    if (filter === 'rev') ok = ok && el.classList.contains('r');
    el.classList.toggle('hide', !ok);
  });
}
// dettaglio carta: immagine grande, quantità e prezzi, vendita a mano
$('main').addEventListener('click', e => {
  const el = e.target.closest('.card');
  if (!el) return;
  const E = state.exps[selected], c = E.cards[el.dataset.p];
  const ls = Object.entries(state.listings).filter(([, l]) => l.p === c.p);
  openDlg(`<div class="big">${imgTag(c, false)}</div>
    <h3>${esc(c.u)} ${esc(c.n)} <span class="small">${esc(c.r)} · ${esc(E.name)}</span></h3>
    ${ls.length ? `<table><tr><th>Variante</th><th>Lingua</th><th>Quantità</th><th>Prezzo €</th><th></th></tr>${ls.map(([k, l]) => `<tr data-k="${esc(k)}">
      <td>${l.rev ? 'Reverse Holo' : 'Normale'}</td><td>${LANGN[l.lang] || l.lang}</td>
      <td><input type="number" min="0" value="${l.q}" data-f="q" style="width:70px"></td>
      <td><input type="number" min="0" step="0.01" value="${priceOf(l) ?? ''}" data-f="price" style="width:90px">${l.price == null && priceOf(l) != null ? '<div class="small">da Cardmarket</div>' : ''}</td>
      <td><button class="sm" data-sell="1">venduta 1</button></td></tr>`).join('')}</table>
      <p class="small">In vendita dal ${new Date(ls[0][1].date).toLocaleDateString('it-IT')}${ls[0][1].com ? ` · commento: ${esc(ls[0][1].com)}` : ''}</p>`
    : '<p class="small">Non in vendita.</p>'}
    <p class="small">${imgSrcs(c).map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noreferrer">immagine ${i + 1}</a>`).join(' · ') || 'nessun link immagine'}</p>
    <p style="text-align:right"><button id="dClose">Chiudi</button></p>`, () => {
    $('dClose').onclick = closeDlg;
    $('dlgBody').querySelectorAll('input[data-f]').forEach(inp => inp.onchange = () => {
      const k = inp.closest('tr').dataset.k, L = state.listings[k];
      if (!L) return;
      if (inp.dataset.f === 'q') { L.q = Math.max(0, +inp.value || 0); if (!L.q) delete state.listings[k]; }
      else L.price = inp.value === '' ? null : +inp.value;
      save(); refresh();
    });
    $('dlgBody').querySelectorAll('[data-sell]').forEach(b => b.onclick = () => {
      sell(b.closest('tr').dataset.k, 1, 'Cardmarket', 'a mano'); save(); closeDlg(); refresh();
    });
  });
});

// ---------- vendite da fattura ----------
async function pdfText(file) {
  if (!window.pdfjsLib) throw new Error('lettore PDF non caricato (serve internet)');
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();
    const rows = new Map();
    tc.items.forEach(it => { const y = Math.round(it.transform[5] / 3) * 3; (rows.get(y) || rows.set(y, []).get(y)).push(it); });
    [...rows.entries()].sort((a, b) => b[0] - a[0]).forEach(([, its]) =>
      lines.push(its.sort((a, b) => a.transform[4] - b.transform[4]).map(i => i.str).join(' ').replace(/\s+/g, ' ').trim()));
  }
  return lines.join('\n');
}
function textOf(raw) {
  if (/<br|<html|<body/i.test(raw)) raw = new DOMParser().parseFromString(raw.replace(/<br\s*\/?>/gi, '\n'), 'text/html').body.textContent;
  return raw.replace(/ /g, ' ');
}
const longestWord = name => String(name || '').split(/[\s\-']+/).map(simp).filter(w => w.length >= 4).sort((a, b) => b.length - a.length)[0] || '';
function parseQty(line) {
  const m = line.match(/(?:^|\s)(\d{1,3})\s*[x×]\s/i) || line.match(/(?:^|[^a-z])[x×]\s?(\d{1,3})\b/i) || line.match(/qt[aà]\.?\s*:?\s*(\d{1,3})/i) || line.match(/quantit[aà]\s*:?\s*(\d{1,3})/i);
  return m ? Math.max(1, +m[1]) : 1;
}
function matchSales(text) {
  const lines = text.split(/\n/).map(l => l.trim()).filter(l => l.length > 2);
  const inv = Object.entries(state.listings).map(([k, l]) => ({ k, l, c: cardOf(l) || {}, set: expName(l.exp) }));
  const found = [];
  lines.forEach((line, i) => {
    const ctx = line + ' ' + (lines[i + 1] || '');
    const L = simp(line);
    const cands = [];
    for (const x of inv) {
      const w = longestWord(x.c.n);
      if (!w || !L.includes(w)) continue;
      let score = 1;
      if (L.includes(simp(x.c.n))) score += 1;
      if (x.c.c && x.c.u && simp(ctx).includes(simp(x.c.c + x.c.u))) score += 3;          // es. "DLR 001"
      else if (/^\d+$/.test(x.c.u) && new RegExp('(^|[^0-9])0*' + parseInt(x.c.u, 10) + '([^0-9]|$)').test(ctx)) score += 1;
      if (simp(ctx).includes(simp(x.set))) score += 1;
      if (/reverse/i.test(ctx) === x.l.rev) score += 1;
      cands.push(Object.assign({ score }, x));
    }
    if (cands.length) { cands.sort((a, b) => b.score - a.score); found.push({ line, qty: parseQty(line), cands }); }
  });
  return found;
}
async function importSales(files) {
  const rows = [];
  for (const f of files) {
    let text;
    try { text = /\.pdf$/i.test(f.name) ? await pdfText(f) : textOf(await f.text()); } catch (e) { alert(`"${f.name}": ${e.message}`); continue; }
    matchSales(text).forEach(r => rows.push(Object.assign(r, { file: f.name })));
  }
  const names = files.map(f => f.name).join(', ');
  if (!rows.length) return openDlg(`<h3>${esc(names)}</h3><p>Non ho trovato nella fattura carte che hai in vendita.</p>
    <p class="small">Se ci sono, mandami un esempio di questa fattura e sistemo la lettura.</p><p style="text-align:right"><button id="dClose">Chiudi</button></p>`, () => { $('dClose').onclick = closeDlg; });
  const guess = /ebay/i.test(names) ? 'eBay' : 'Cardmarket';
  openDlg(`<h3>Carte vendute in: ${esc(names)}</h3>
    <div class="row" style="margin-bottom:8px">Venduta su <select id="saleSite">${['Cardmarket', 'eBay', 'Altro'].map(s => `<option ${s === guess ? 'selected' : ''}>${s}</option>`).join('')}</select>
    <span class="small">Le righe spuntate vengono tolte dalle carte in vendita.</span></div>
    <div style="max-height:55vh;overflow:auto"><table><tr><th></th><th>Riga della fattura</th><th>Carta in vendita</th><th>Q.tà</th></tr>
    ${rows.map((r, i) => {
      const top = r.cands[0], sure = top.score >= 3 && (r.cands.length === 1 || r.cands[1].score < top.score);
      return `<tr><td><input type="checkbox" data-i="${i}" ${sure ? 'checked' : ''}></td><td class="line">${esc(r.line)}</td>
        <td><select data-s="${i}">${r.cands.slice(0, 8).map((c, j) => `<option value="${j}">${esc(c.c.u)} ${esc(c.c.n)} · ${esc(c.set)}${c.l.rev ? ' · REVERSE' : ''} (${c.l.q} in vendita)</option>`).join('')}</select></td>
        <td><input type="number" min="1" value="${r.qty}" data-q="${i}" style="width:60px"></td></tr>`;
    }).join('')}</table></div>
    <p style="text-align:right"><button id="dClose">Annulla</button> <button class="pri" id="dApply">Togli le vendute</button></p>`, () => {
    $('dClose').onclick = closeDlg;
    $('dApply').onclick = () => {
      let n = 0;
      const B = $('dlgBody');
      rows.forEach((r, i) => {
        if (!B.querySelector(`[data-i="${i}"]`).checked) return;
        const cand = r.cands[+B.querySelector(`[data-s="${i}"]`).value];
        const q = Math.max(1, +B.querySelector(`[data-q="${i}"]`).value || 1);
        sell(cand.k, q, $('saleSite').value, r.file); n += q;
      });
      save(); closeDlg(); refresh(); toast(`Tolte ${n} carte vendute`);
    };
  });
}
function sell(k, q, source, file) {
  const L = state.listings[k];
  if (!L) return;
  const c = cardOf(L) || {};
  const n = Math.min(q, L.q);
  L.q -= n;
  state.sold.push({ date: today(), p: L.p, exp: L.exp, name: c.n || '', num: c.u || '', rev: L.rev, lang: L.lang, q: n, price: priceOf(L), source, file: file || '' });
  if (L.q <= 0) delete state.listings[k];
}
function showSold() {
  const list = state.sold.map((s, i) => [s, i]).reverse();
  const tot = state.sold.reduce((a, s) => a + (s.price || 0) * s.q, 0);
  openDlg(`<h3>Carte vendute (${state.sold.reduce((a, s) => a + s.q, 0)} · ${eur(tot)} ai prezzi di listino)</h3>
    <div style="max-height:62vh;overflow:auto">${list.length ? `<table><tr><th>Data</th><th>Carta</th><th>Set</th><th>Q.tà</th><th>Prezzo</th><th>Dove</th><th></th></tr>
    ${list.map(([s, i]) => `<tr><td>${new Date(s.date).toLocaleDateString('it-IT')}</td><td>${esc(s.num)} ${esc(s.name)}${s.rev ? ' (Reverse)' : ''}</td>
      <td>${esc(expName(s.exp))}</td><td>${s.q}</td><td>${eur(s.price)}</td><td>${esc(s.source)}<div class="small">${esc(s.file)}</div></td>
      <td><button class="sm" data-undo="${i}">annulla</button></td></tr>`).join('')}</table>` : '<p>Nessuna vendita.</p>'}</div>
    <p style="text-align:right"><button id="dClose">Chiudi</button></p>`, () => {
    $('dClose').onclick = closeDlg;
    $('dlgBody').querySelectorAll('[data-undo]').forEach(b => b.onclick = () => {
      const s = state.sold[+b.dataset.undo];
      const k = lkey(s.p, s.rev, s.lang);
      const L = state.listings[k] || (state.listings[k] = { p: s.p, exp: s.exp, rev: s.rev, lang: s.lang, q: 0, price: s.price, date: s.date, com: '' });
      L.q += s.q;
      state.sold.splice(+b.dataset.undo, 1);
      save(); refresh(); showSold();
    });
  });
}

// ---------- comandi ----------
function openDlg(html, wire) { $('dlgBody').innerHTML = html; if (!$('dlg').open) $('dlg').showModal(); wire && wire(); }
function closeDlg() { $('dlg').close(); }
function refresh() {
  const ls = Object.values(state.listings);
  const copies = ls.reduce((a, l) => a + l.q, 0);
  const value = ls.reduce((a, l) => a + (priceOf(l) || 0) * l.q, 0);
  const sets = new Set(ls.map(l => l.exp)).size;
  $('stats').textContent = `In vendita su Cardmarket: ${copies} copie · ${ls.length} righe · ${sets} set · valore ${eur(value)} · vendute ${state.sold.reduce((a, s) => a + s.q, 0)}` +
    (state.legacy.length ? ` · ${state.legacy.length} carte della versione precedente in attesa dell'elenco del loro set` : '');
  renderSets(); renderSet();
}
$('btnSale').onclick = () => $('fSale').click();
$('fSale').onchange = e => { importSales([...e.target.files]); e.target.value = ''; };
$('btnSold').onclick = showSold;
$('btnMore').onclick = () => openDlg(`<h3>Altro</h3>
  <p class="row"><button id="bBackup">💾 Scarica backup</button><button id="bRestore">↩ Ripristina backup</button><button id="bWipe">🗑 Svuota carte in vendita</button></p>
  <p class="small">${(() => { const all = Object.values(state.exps).flatMap(e => Object.values(e.cards)); const wi = all.filter(c => c.i).length, wm = all.filter(c => c.m != null).length;
    return `Controllo: ${all.length} carte negli elenchi dei set · ${wi} con link immagine da Cardmarket · ${wm} con il tuo prezzo attuale da Cardmarket.`; })()}</p>
  <p class="small">I dati sono salvati in questo browser. Fai un backup ogni tanto: se pulisci i dati di Chrome o cambi PC, lo ripristini da qui.</p>
  <p class="small">Pulsante per Cardmarket: <a href="../cardmarket/">pagina di installazione</a>.</p>
  <p style="text-align:right"><button id="dClose">Chiudi</button></p>`, () => {
  $('dClose').onclick = closeDlg;
  $('bBackup').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(state)], { type: 'application/json' }));
    a.download = `gestionale-carte-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
  };
  $('bRestore').onclick = () => $('fRestore').click();
  $('bWipe').onclick = () => { if (confirm('Cancellare tutte le carte in vendita e le vendite? Fai prima un backup.')) { state = { exps: state.exps, expList: state.expList, listings: {}, sold: [], legacy: [] }; save(); closeDlg(); refresh(); } };
});
$('fRestore').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { const s = JSON.parse(await f.text()); if (!s.exps) throw 0; if (confirm('Sostituire i dati attuali con questo backup?')) { state = Object.assign({ expList: [], listings: {}, sold: [], legacy: [] }, s); save(); closeDlg(); refresh(); } }
  catch (err) { alert('Backup non valido.'); }
};
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) importSales([...e.dataTransfer.files]); });
// nuovi dati da Cardmarket mentre la pagina è già aperta (stessa scheda)
window.addEventListener('hashchange', () => { const id = importFromHash(); if (id) selected = id; refresh(); });

const arrived = importFromHash();
const cnt0 = counts();
selected = arrived || Object.keys(cnt0).sort((a, b) => cnt0[b] - cnt0[a])[0] || null;
refresh();
</script>
